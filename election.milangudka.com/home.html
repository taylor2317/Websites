<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Election Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="dashboard">

    <header class="header">
        <div>
            <h1>GB UK Local Elections 2026</h1>
            <p>Live England council results</p>
        </div>

        <div class="updated">
            Updated: <span id="time">--:--:--</span>
        </div>

        <button id="fsBtn" class="fs-btn" aria-label="Fullscreen">
            <i class="fas fa-expand"></i>
        </button>
    </header>

    <main class="grid" id="grid"></main>

</div>

<script src="scripts.js"></script>
<script src="https://kit.fontawesome.com/7e891fcb86.js" crossorigin="anonymous"></script>
</body>
</html>
